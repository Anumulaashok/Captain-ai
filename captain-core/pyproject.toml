[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "captain-core"
version = "1.0.0"
description = "Captain AI — local macOS AI assistant backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "sse-starlette>=2.1.0",

    # Data validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Database (Neon PostgreSQL)
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # Vector DB (Pinecone)
    "pinecone>=5.4.0",

    # HTTP client
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",

    # LLM
    "ollama>=0.3.3",

    # Voice — STT
    "faster-whisper>=1.0.3",
    "webrtcvad>=2.0.10",
    "pyaudio>=0.2.14",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",

    # Voice — TTS
    "piper-tts>=1.2.0",
    "soundfile>=0.12.0",

    # Gmail / Google APIs
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",

    # Wake word
    "openwakeword>=0.6.0",

    # Security
    "keyring>=25.4.0",
    "cryptography>=43.0.0",

    # File / document handling
    "pypdf>=5.1.0",
    "python-docx>=1.1.0",
    "pillow>=11.0.0",

    # Web browsing (browser agent)
    "playwright>=1.48.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",

    # Scheduler (background agent runners)
    "apscheduler>=3.10.0",
    "PyGithub>=2.1.0",

    # Utilities
    "rich>=13.9.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "uuid7>=0.1.0",
    "arrow>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]
mlx = [
    "mlx>=0.20.0",
    "mlx-lm>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = [
  "agents",
  "api",
  "briefing",
  "db",
  "goals",
  "integrations",
  "learning",
  "memory",
  "metrics",
  "models",
  "notifications",
  "orchestrator",
  "scheduler",
  "security",
  "voice",
  "watchers",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
